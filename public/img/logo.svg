<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PlayZone">
  <defs>
    <linearGradient id="pz-fill" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a22"/>
      <stop offset="55%" stop-color="#e10600"/>
      <stop offset="100%" stop-color="#7a0400"/>
    </linearGradient>
    <filter id="pz-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#pz-fill)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#cfcfcf" stroke-opacity="0.7" stroke-width="1.5"/>
  <polygon points="27,21 27,43 47,32" fill="#fff" filter="url(#pz-glow)"/>
</svg>
